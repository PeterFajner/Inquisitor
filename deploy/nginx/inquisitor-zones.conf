# Per-IP limits for Inquisitor's sites (inquisitor.pfaj.ca and its preview;
# the app's own are global, as it sees no addresses): passkey steps (new
# accounts, challenges), share-only snapshots, writes, and the rules' live
# event streams. Zones are named for this site (conf.d is shared).
limit_req_zone $binary_remote_addr zone=inquisitor_passkey:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=inquisitor_share:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=inquisitor_writes:1m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=inquisitor_streams:1m;
