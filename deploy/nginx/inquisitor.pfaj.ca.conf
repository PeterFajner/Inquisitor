# inquisitor.pfaj.ca: the character builder (inquisitor.service on
# 127.0.0.1:3010; locations in inquisitor-app.inc). NOT INSTALLED YET: the
# live vhost still serves the 2023 app from /var/www/inquisitor. This
# replaces it at the switch (DEPLOY.md).
server {
    server_name inquisitor.pfaj.ca;

    include /etc/nginx/conf.d/inquisitor-app.inc;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/inquisitor.pfaj.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inquisitor.pfaj.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name inquisitor.pfaj.ca;
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}
