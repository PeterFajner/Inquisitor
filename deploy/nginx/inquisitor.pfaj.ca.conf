# inquisitor.pfaj.ca: the character builder (inquisitor.service on
# 127.0.0.1:3010). NOT INSTALLED YET: the live vhost still serves the 2023
# app from /var/www/inquisitor. This replaces it at the switch (DEPLOY.md).
# The app stores no IP addresses, so none are passed to it.
#
# Static files (scripts, CSS, icons) are served by nginx straight from disk,
# so the app spends no memory on them; anything missing falls through to
# the app.
# Per-IP limits (the app's own are global, as it sees no addresses):
# passkey steps (new accounts, challenges), share-only snapshots, and the
# rules' live event streams. Zones are named for this site (conf.d is shared).
limit_req_zone $binary_remote_addr zone=inquisitor_passkey:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=inquisitor_share:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=inquisitor_writes:1m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=inquisitor_streams:1m;

server {
    server_name inquisitor.pfaj.ca;

    # No other site may frame these pages (the app sends the same).
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }

    # The browser code and CSS (scripts/client.ts): every file named by its
    # content hash, so it never changes and can be cached for good.
    location /static/client/ {
        alias /opt/inquisitor/dist/client/;
        types { text/javascript js mjs; text/css css; application/json json; }
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        error_page 404 = @app;
    }
    # The icons (src/static/), and the two asked for at the root by name.
    location /static/          { alias /opt/inquisitor/src/static/;                             include /etc/nginx/conf.d/inquisitor-static.inc; }
    location = /favicon.ico          { alias /opt/inquisitor/src/static/favicon.ico;          include /etc/nginx/conf.d/inquisitor-static.inc; }
    location = /apple-touch-icon.png { alias /opt/inquisitor/src/static/apple-touch-icon.png; include /etc/nginx/conf.d/inquisitor-static.inc; }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host inquisitor.pfaj.ca;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The import after signing in carries every character a browser kept (2 MB cap in the app).
        client_max_body_size 3m;
        limit_req zone=inquisitor_writes burst=60 nodelay;
        limit_req_status 429;
    }
    location = /api/v1/account/passkey {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host inquisitor.pfaj.ca;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
        limit_req zone=inquisitor_passkey burst=10 nodelay;
        limit_req_status 429;
    }
    location = /api/v1/share {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host inquisitor.pfaj.ca;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        limit_req zone=inquisitor_share burst=5 nodelay;
        limit_req_status 429;
    }
    location = /api/v1/rules/events {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host inquisitor.pfaj.ca;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        limit_conn inquisitor_streams 8;
        limit_conn_status 429;
    }

    location @app {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host inquisitor.pfaj.ca;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/inquisitor.pfaj.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inquisitor.pfaj.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name inquisitor.pfaj.ca;
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}
