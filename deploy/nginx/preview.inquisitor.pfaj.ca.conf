# preview.inquisitor.pfaj.ca: the new character builder before the switch
# (inquisitor.pfaj.ca still serves the 2023 app). PUBLIC_ORIGIN is this
# host and PASSKEY_RP_ID is inquisitor.pfaj.ca, so passkeys made here keep
# working after the switch. Locations: inquisitor-app.inc.
server {
    server_name preview.inquisitor.pfaj.ca;
    include /etc/nginx/conf.d/inquisitor-app.inc;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/preview.inquisitor.pfaj.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.inquisitor.pfaj.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name preview.inquisitor.pfaj.ca;
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}
