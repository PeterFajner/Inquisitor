# Restrictions: late (Armor row after the gear), seeded, conditional, exclusive.
id: restricted
kind: archetype
name: Restricted
source: { page: 1 }
subtypes:
  - { id: fighter, name: Fighter, stats: { WS: 50, BS: 50, S: 70, T: 50, I: 50, Wp: 50, Sg: 50, Nv: 50, Ld: 50 } }
sections:
  - name: Equipment
    effects:
      - { restrict: { pool: item, tag: [power-weapon, bolt-weapon], only: [maul] } }
      - { id: gear, gear: { count: 2, availability: [Common, Rare, Legendary] } }
      - { id: armour-roll, roll: armour-types }
      - { id: any-pistol, pick: 1, pool: item, filter: { category: [Pistol], exclude: [laspistol] } }
      - { id: weapon, pick: 1, pool: item, filter: { tag: [power-weapon, bolt-weapon, bladed] } }
      - { id: armour, pick: 1, pool: item, filter: { group: [Armour] } }
  - name: Armor
    effects:
      - { restrict: { pool: item, group: [Armour], maxAV: 3 } }
  - name: Talents
    effects:
      - { talent: natural-psyker }
      - { id: psy, pick: 1, pool: talent, filter: { group: [Psyker Talents] } }
  - name: Alignment
    effects:
      - { id: alignment, alignment: [Puritan, Radical] }
      - when: { not: { alignment: [Radical] } }
        then: [{ restrict: { pool: item, except: [chaos], alien: false } }]
